<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330">
<rect width="1100" height="330" rx="24" fill="#0b1119"/>
<text x="55" y="50" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="24" font-weight="700">Jetson Autonomy Runtime</text>
<text x="55" y="78" fill="#8ca0b3" font-family="Arial,sans-serif" font-size="14">camera / sensor ingest → GPU inference → state estimation → planning → control</text>
<g font-family="Arial,sans-serif" font-size="14">
<rect x="45" y="125" width="155" height="90" rx="15" fill="#111d28" stroke="#55dff8" stroke-opacity=".55"/><text x="65" y="157" fill="#dff9ff" font-weight="700">Capture + timing</text><text x="65" y="183" fill="#8fa5b5">V4L2 · DMA-BUF</text>
<rect x="230" y="125" width="155" height="90" rx="15" fill="#111d28" stroke="#8f86ff" stroke-opacity=".55"/><text x="250" y="157" fill="#f0edff" font-weight="700">Perception</text><text x="250" y="183" fill="#8fa5b5">CUDA · TensorRT</text>
<rect x="415" y="125" width="155" height="90" rx="15" fill="#111d28" stroke="#72e5b3" stroke-opacity=".55"/><text x="435" y="157" fill="#e4fff3" font-weight="700">Estimator</text><text x="435" y="183" fill="#8fa5b5">IMU + position</text>
<rect x="600" y="125" width="155" height="90" rx="15" fill="#111d28" stroke="#f4c56b" stroke-opacity=".55"/><text x="620" y="157" fill="#fff3d4" font-weight="700">Planner</text><text x="620" y="183" fill="#8fa5b5">waypoint mission</text>
<rect x="785" y="125" width="155" height="90" rx="15" fill="#111d28" stroke="#ff879e" stroke-opacity=".55"/><text x="805" y="157" fill="#ffe5ea" font-weight="700">Controller</text><text x="805" y="183" fill="#8fa5b5">vehicle interface</text>
<path d="M200 170h20M385 170h20M570 170h20M755 170h20M940 170h60" stroke="#567383" stroke-width="2"/>
<text x="55" y="270" fill="#6f8394" font-size="12">Desktop plant swaps for a flight-control IPC boundary on target hardware; Jetson-specific zero-copy paths remain isolated from the portable core.</text>
</g></svg>