name: LeRobot MicroFactory
on:
  push:
    paths:
      - 'projects/lerobot-microfactory/**'
      - '.github/workflows/lerobot-microfactory.yml'
  pull_request:
    paths:
      - 'projects/lerobot-microfactory/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/lerobot-microfactory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: microfactory eval --episodes 25 --min-success-rate 0.95
